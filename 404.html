  <style>
    .error-page-wrapper {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(244, 119, 33, 0.05) 0%, transparent 65%);
    }
    .error-card {
      max-width: 580px;
      background: #ffffff;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(19, 34, 56, 0.08);
      border: 1px solid #EAEFF5;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      color: var(--primary-navy, #132238);
      letter-spacing: -3px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #132238 30%, #F47721 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 50px;
      border: 1.5px solid #d4af37;
      color: #a17822;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;

    .error-title {

      font-weight: 800;
      color: var(--primary-navy, #132238);
      margin-bottom: 14px;
    }
    .error-desc {
      font-size: 0.98rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .error-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-return-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-navy, #132238);
      color: #ffffff !important;
      padding: 12px 26px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(19, 34, 56, 0.2);
    }
    .btn-return-home:hover {
      background: #F47721;
      transform: translateY(-2px);

    </div>

      <div class="error-badge">✦ PAGE NOT FOUND</div>
