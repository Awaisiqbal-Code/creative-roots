<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 55" width="160" height="55">
  <g fill="#181818" stroke="#181818">
    <!-- Top Coronet / Crown -->
    <path d="M 72,11 L 74,7 L 76,11 L 80,5 L 84,11 L 86,7 L 88,11 L 87,14 L 73,14 Z" fill="#181818" stroke="none"/>
    <circle cx="74" cy="6" r="1" fill="#181818"/>
    <circle cx="80" cy="4" r="1.2" fill="#181818"/>
    <circle cx="86" cy="6" r="1" fill="#181818"/>
    
    <!-- Central Escutcheon Shield -->
    <path d="M 72,16 L 88,16 C 88,27 84,33 80,36 C 76,33 72,27 72,16 Z" fill="none" stroke="#181818" stroke-width="1.8"/>
    <path d="M 74,18 L 86,18 C 86,26 83,31 80,33.5 C 77,31 74,26 74,18 Z" fill="none" stroke="#181818" stroke-width="0.8"/>
    
    <!-- Crest Letter 'F' -->
    <text x="80" y="28.5" font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="900" font-style="italic" fill="#181818" stroke="none" text-anchor="middle">F</text>
    
    <!-- Left Rampant Winged Creature / Lion -->
    <g stroke="none" fill="#181818">
      <path d="M 71,20 C 67,17 64,15 60,17 C 58,18 56,22 57,25 C 55,24 53,22 52,19 C 51,24 54,28 58,29 C 56,31 54,34 56,37 C 58,38 62,37 65,34 C 67,35 69,33 71,30 Z"/>
      <!-- Wing -->
      <path d="M 64,17 C 62,12 56,9 50,11 C 52,14 56,16 61,18 Z"/>
      <path d="M 60,14 C 57,9 52,7 46,9 C 48,12 53,13 58,15 Z"/>
    </g>
    
    <!-- Right Rampant Winged Creature / Lion -->
    <g stroke="none" fill="#181818">
      <path d="M 89,20 C 93,17 96,15 100,17 C 102,18 104,22 103,25 C 105,24 107,22 108,19 C 109,24 106,28 102,29 C 104,31 106,34 104,37 C 102,38 98,37 95,34 C 93,35 91,33 89,30 Z"/>
      <!-- Wing -->
      <path d="M 96,17 C 98,12 104,9 110,11 C 108,14 104,16 99,18 Z"/>
      <path d="M 100,14 C 103,9 108,7 114,9 C 112,12 107,13 102,15 Z"/>
    </g>
    
    <!-- Ribbon Scroll Underneath -->
    <path d="M 62,39 C 71,37 89,37 98,39 L 96,43 C 88,41 72,41 64,43 Z" fill="#181818" stroke="none"/>
    <text x="80" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#181818" stroke="none" text-anchor="middle" letter-spacing="1.2">FLYING GROUP</text>
  </g>
</svg>
