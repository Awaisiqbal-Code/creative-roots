<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 50" width="170" height="50">
  <!-- SAZGAR Automotive & Engineering Brandmark -->
  <g>
    <!-- Metallic Chrome Emblem Badge -->
    <g transform="translate(85, 18)">
      <!-- Outer Oval -->
      <ellipse cx="0" cy="0" rx="20" ry="12" fill="none" stroke="#2b2b2b" stroke-width="2.2"/>
      
      <!-- Intersecting 'S' Dual Swooshes -->
      <path d="M -6,11 C -4,6 -1,0 0,-11 C -1,-5 -4,3 -6,11 Z" fill="#2b2b2b"/>
      <path d="M 6,-11 C 4,-6 1,0 0,11 C 1,5 4,-3 6,-11 Z" fill="#2b2b2b"/>
      <path d="M -9,-6 C -3,-1 3,1 9,6" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
    </g>
    
    <!-- Tracked S A Z G A R Typography -->
    <text x="85" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#181818" text-anchor="middle" letter-spacing="7">SAZGAR</text>
  </g>
</svg>
