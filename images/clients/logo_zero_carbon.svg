<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <!-- Zero Carbon Solar Brandmark -->
  <g>
    <!-- Sun-Gear Energy Icon -->
    <g transform="translate(18, 25)">
      <!-- Smooth Orange Crescent -->
      <path d="M 0,-15 A 15,15 0 0,0 -15,0 A 15,15 0 0,0 0,15 A 8,8 0 0,1 -8,0 A 8,8 0 0,1 0,-15 Z" fill="#f97316"/>
      
      <!-- Segmented Solar Rays (Right Half) -->
      <path d="M 3,-14 L 8,-12 L 6,-6 L 1,-8 Z" fill="#f97316"/>
      <path d="M 9,-9 L 14,-6 L 10,-2 L 5,-4 Z" fill="#f59e0b"/>
      <path d="M 12,-3 L 16,-1 L 16,3 L 11,2 Z" fill="#f59e0b"/>
      <path d="M 11,4 L 15,7 L 13,11 L 8,8 Z" fill="#ea580c"/>
      <path d="M 6,9 L 9,14 L 4,15 L 2,10 Z" fill="#ea580c"/>
    </g>
    
    <!-- ZERO CARBON Typography -->
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="14.5" font-weight="900" fill="#1e293b" letter-spacing="1">ZERO</text>
    <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="14.5" font-weight="900" fill="#1e293b" letter-spacing="1">CARBON</text>
    
    <!-- SOLAR Subtitle in Orange -->
    <text x="120" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#f97316" letter-spacing="1.5">SOLAR</text>
  </g>
