<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Lahore Grammar School (LGS) Crest -->
  <g>
    <!-- Outer Shield -->
    <path d="M 22,6 L 78,6 L 78,48 C 78,62 50,75 50,75 C 50,75 22,62 22,48 Z" fill="#1d3d84"/>
    
    <!-- Inner White Stroke -->
    <path d="M 26,10 L 74,10 L 74,46 C 74,58 50,69 50,69 C 50,69 26,58 26,46 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    
    <!-- LGS Monogram Text -->
    <text x="50" y="27" font-family="'Times New Roman', Georgia, serif" font-size="16.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">LGS</text>
    
    <!-- Horizontal Divider -->
    <line x1="28" y1="33" x2="72" y2="33" stroke="#ffffff" stroke-width="2.2"/>
    
    <!-- Rising Sun -->
    <circle cx="50" cy="45" r="7" fill="#ffffff"/>
    
    <!-- Sun Rays -->
    <line x1="50" y1="35" x2="50" y2="37" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="42" y1="37" x2="44" y2="39" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="58" y1="37" x2="56" y2="39" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="37" y1="42" x2="39" y2="43" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="63" y1="42" x2="61" y2="43" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Sea Waves -->
    <path d="M 30,48 C 36,46 44,49 50,47 C 56,45 64,49 70,47" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Lower Chevron / Base -->
    <path d="M 32,56 L 50,64 L 68,56" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
