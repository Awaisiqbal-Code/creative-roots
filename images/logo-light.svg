<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 54" width="330" height="54" fill="none">
  <!-- Creative Roots Official Round Crest (Light Variant for Navy Footer) -->
  <g transform="translate(4, 3)">
    <!-- Yellow Outer Ring -->
    <circle cx="24" cy="24" r="23" stroke="#F47721" stroke-width="2" fill="none"/>
    <circle cx="24" cy="24" r="21.5" stroke="#FFAE19" stroke-width="1.2" fill="none"/>
    <!-- Dark Navy Center Disc -->
    <circle cx="24" cy="24" r="20.5" fill="#132238"/>

    <!-- Outer Circular Text Arc 'ADVERTISING' -->
    <path id="crestArcLight" d="M 8 24 A 16 16 0 1 1 40 24" fill="none"/>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="4.2" font-weight="700" fill="#FFFFFF" letter-spacing="2.8">
      <textPath href="#crestArcLight" startOffset="6%">ADVERTISING</textPath>
    </text>

    <!-- Vibrant Green Leaf Canopy -->
    <ellipse cx="24" cy="14" rx="4.5" ry="6" fill="#58C843"/>
    <ellipse cx="18" cy="18" rx="4.2" ry="5.5" fill="#6EE854" transform="rotate(-20 18 18)"/>
    <ellipse cx="30" cy="18" rx="4.2" ry="5.5" fill="#58C843" transform="rotate(20 30 18)"/>
    <ellipse cx="15" cy="24" rx="4.5" ry="5.2" fill="#6EE854" transform="rotate(-40 15 24)"/>
    <ellipse cx="33" cy="24" rx="4.5" ry="5.2" fill="#58C843" transform="rotate(40 33 24)"/>

    <!-- Brown Trunk & Grounded Roots -->
    <path d="M 21.5 22 Q 22.5 28 20.5 37 L 27.5 37 Q 25.5 28 26.5 22 Z" fill="#B36E49"/>
    <!-- Deep Root Base -->
    <path d="M 16 37 Q 24 35 32 37 L 34 39 Q 24 37.5 14 39 Z" fill="#935738"/>
    <!-- Warm Ochre Grass Horizon -->
    <path d="M 14 36.5 L 34 36.5" stroke="#F47721" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Subtle 'Creative Roots' Inner Script -->
    <text x="24" y="34" font-family="'Plus Jakarta Sans', cursive, sans-serif" font-size="3.8" font-weight="800" text-anchor="middle">
      <tspan fill="#6EE854">Creative </tspan><tspan fill="#F47721">Roots</tspan>
    </text>
  </g>

  <!-- Luxury Typographic Wordmark & Subtitle for Dark Backgrounds -->
  <g transform="translate(62, 0)">
    <!-- Primary Brand Wordmark: Green 'Creative' + Orange 'Roots' -->
    <text x="0" y="27" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4">
      <tspan fill="#6EE854">Creative </tspan><tspan fill="#F47721">Roots</tspan>
    </text>
    
    <!-- Tagline Subtitle -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.3" fill="#CAD7E6">
      Printing | Corporate Events | Exhibition Stalls
    </text>
  </g>
</svg>
