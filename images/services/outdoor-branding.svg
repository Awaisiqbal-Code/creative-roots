<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="obSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="obBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113627"/>
      <stop offset="50%" stop-color="#0D281D"/>
      <stop offset="100%" stop-color="#05140D"/>
    </linearGradient>
    <linearGradient id="obGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="obSteelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="obLightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </linearGradient>
    <filter id="obShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#05140D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="3" fill="#000000" opacity="0.18"/>

  <g filter="url(#obShadow)">
    <!-- Spotlights Top Brackets & Beams -->
    <!-- Left Spotlight & Beam -->
    <path d="M 17 8 L 19 14 L 14 14 Z" fill="#475569"/>
    <circle cx="18" cy="8" r="2" fill="url(#obGoldGrad)"/>
    <polygon points="17,9 13,19 22,19" fill="url(#obLightBeam)"/>

    <!-- Center-Right Spotlight & Beam -->
    <path d="M 47 8 L 49 14 L 44 14 Z" fill="#475569"/>
    <circle cx="46" cy="8" r="2" fill="url(#obGoldGrad)"/>
    <polygon points="46,9 41,19 50,19" fill="url(#obLightBeam)"/>

    <!-- Heavy Architectural Billboard Frame -->
    <rect x="8" y="13" width="48" height="26" rx="4" fill="#0A0F1D" stroke="#334155" stroke-width="1"/>
    
    <!-- Billboard Advertising Face / Poster Canvas -->
    <rect x="10.5" y="15.5" width="43" height="21" rx="2.5" fill="url(#obBoardGrad)"/>
    
    <!-- Gold Metallic Border Inset -->
    <rect x="11.5" y="16.5" width="41" height="19" rx="1.5" fill="none" stroke="url(#obGoldGrad)" stroke-width="0.8" stroke-opacity="0.85"/>
    
    <!-- Creative Roots Brand Icon Emblem on Billboard -->
    <g transform="translate(16, 21)">
      <!-- Tiny Brand Logo Emblem -->
      <circle cx="6" cy="5" r="4" fill="url(#obGoldGrad)"/>
      <path d="M 6 2 C 7 3.5 7 5 6 6.5 C 5 5 5 3.5 6 2 Z" fill="#113627"/>
      <!-- Brand Headline Bars -->
      <rect x="13" y="2.5" width="16" height="2" rx="1" fill="#FFFFFF"/>
      <rect x="13" y="5.5" width="11" height="1.5" rx="0.75" fill="url(#obGoldGrad)"/>
    </g>

    <!-- Support Gantry Truss Structure Behind/Under Board -->
    <rect x="14" y="39" width="36" height="3" fill="#1E293B" stroke="#475569" stroke-width="0.6"/>

    <!-- Heavy Central Steel Unipole Pillar Column -->
    <rect x="29" y="42" width="6" height="15" fill="url(#obSteelGrad)"/>
    <line x1="31" y1="42" x2="31" y2="57" stroke="#E2E8F0" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- Unipole Heavy Flange Concrete Base -->
    <polygon points="25,57 39,57 37,54 27,54" fill="#475569"/>
    <circle cx="28" cy="55.5" r="0.8" fill="#CBD5E1"/>
    <circle cx="36" cy="55.5" r="0.8" fill="#CBD5E1"/>
  </g>
</svg>
