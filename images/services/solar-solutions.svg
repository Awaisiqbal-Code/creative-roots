<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="solarSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#F47721"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="solarPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="solarFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <linearGradient id="solarLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- Sun Rays & Glow -->
  <circle cx="32" cy="18" r="9" fill="url(#solarSunGrad)"/>
  <g stroke="url(#solarSunGrad)" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="7"/>
    <line x1="32" y1="29" x2="32" y2="31"/>
    <line x1="18" y1="18" x2="21" y2="18"/>
    <line x1="43" y1="18" x2="46" y2="18"/>
    <line x1="22" y1="8" x2="24.5" y2="10.5"/>
    <line x1="39.5" y1="25.5" x2="42" y2="28"/>
    <line x1="42" y1="8" x2="39.5" y2="10.5"/>
    <line x1="24.5" y1="25.5" x2="22" y2="28"/>
  </g>

  <!-- Solar Panel (Tilted 3D Perspective) -->
  <!-- Base Stand/Legs -->
  <polygon points="20,53 23,43 25,43 22,53" fill="url(#solarFrameGrad)"/>
  <polygon points="42,53 39,43 41,43 44,53" fill="url(#solarFrameGrad)"/>
  <rect x="18" y="52" width="28" height="2.5" rx="1" fill="#546E7A"/>

  <!-- Panel Frame Outer -->
  <polygon points="10,48 54,48 48,31 16,31" fill="url(#solarFrameGrad)" stroke="#455A64" stroke-width="1"/>

  <!-- Panel Grid Faces (Blue cells) -->
  <polygon points="12,46 52,46 47,33 17,33" fill="url(#solarPanelGrad)"/>

  <!-- Panel Grid Lines -->
  <!-- Horizontal dividers -->
  <polygon points="14.5,39.5 49.5,39.5 48.5,37.5 15.5,37.5" fill="#90CAF9" opacity="0.7"/>
  <!-- Vertical dividers -->
  <line x1="25" y1="33" x2="22" y2="46" stroke="#90CAF9" stroke-width="1.2" opacity="0.8"/>
  <line x1="32" y1="33" x2="32" y2="46" stroke="#90CAF9" stroke-width="1.2" opacity="0.8"/>
  <line x1="39" y1="33" x2="42" y2="46" stroke="#90CAF9" stroke-width="1.2" opacity="0.8"/>

  <!-- Green Energy Leaf Accent -->
  <path d="M48,50 C54,46 58,40 56,34 C50,35 46,39 45,45 C46,47 47,49 48,50 Z" fill="url(#solarLeafGrad)"/>
  <path d="M48,50 C51,45 54,40 56,34" stroke="#A5D6A7" stroke-width="0.8" fill="none"/>
</svg>
