<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="opSteelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="opCyanRoller" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="opMagentaRoller" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE185D"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="opYellowRoller" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="opBlackRoller" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="opGoldCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="opShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Shadow -->
  <ellipse cx="32" cy="57" rx="22" ry="3.5" fill="#000000" opacity="0.16"/>

  <g filter="url(#opShadow)">
    <!-- Industrial Machine Side Frame Bracket (Left & Right) -->
    <path d="M 12 12 L 18 12 L 18 52 L 12 52 Z" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
    <path d="M 46 12 L 52 12 L 52 52 L 46 52 Z" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
    
    <!-- Machine Side Mechanical Drive Gear -->
    <circle cx="15" cy="33" r="5" fill="#334155" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="15" cy="33" r="2" fill="#0F172A"/>
    <circle cx="49" cy="33" r="5" fill="#334155" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="49" cy="33" r="2" fill="#0F172A"/>

    <!-- 4 CMYK Top Inking Rollers -->
    <!-- Cyan Roller -->
    <rect x="18" y="14" width="28" height="5" rx="2.5" fill="url(#opCyanRoller)"/>
    <line x1="20" y1="15.5" x2="44" y2="15.5" stroke="#E0F2FE" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- Magenta Roller -->
    <rect x="18" y="21" width="28" height="5" rx="2.5" fill="url(#opMagentaRoller)"/>
    <line x1="20" y1="22.5" x2="44" y2="22.5" stroke="#FFE4E6" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- Yellow Roller -->
    <rect x="18" y="28" width="28" height="5" rx="2.5" fill="url(#opYellowRoller)"/>
    <line x1="20" y1="29.5" x2="44" y2="29.5" stroke="#FEF3C7" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- Key/Black Roller -->
    <rect x="18" y="35" width="28" height="5" rx="2.5" fill="url(#opBlackRoller)"/>
    <line x1="20" y1="36.5" x2="44" y2="36.5" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- Major Metallic Plate & Blanket Cylinder (Heavy Drum) -->
    <rect x="16" y="42" width="32" height="9" rx="3.5" fill="url(#opSteelGrad)"/>
    <line x1="18" y1="44" x2="46" y2="44" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.9"/>
    
    <!-- Printed Precision Paper Web Flowing Out -->
    <path d="M 17 50 C 24 53 40 48 47 52 L 47 55 C 40 51 24 56 17 53 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.6"/>
    <!-- Color dots on emerging web -->
    <circle cx="25" cy="53" r="1" fill="#0284C7"/>
    <circle cx="29" cy="53" r="1" fill="#BE185D"/>
    <circle cx="33" cy="53" r="1" fill="#D97706"/>
    <circle cx="37" cy="53" r="1" fill="#0F172A"/>

    <!-- Gold Accent Bolts on Frame -->
    <circle cx="15" cy="16" r="1.3" fill="url(#opGoldCylinder)"/>
    <circle cx="15" cy="48" r="1.3" fill="url(#opGoldCylinder)"/>
    <circle cx="49" cy="16" r="1.3" fill="url(#opGoldCylinder)"/>
    <circle cx="49" cy="48" r="1.3" fill="url(#opGoldCylinder)"/>
  </g>
</svg>
