<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="esCanopyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#144D37"/>
      <stop offset="50%" stop-color="#1B5E43"/>
      <stop offset="100%" stop-color="#0F3D2B"/>
    </linearGradient>
    <linearGradient id="esBackwallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="esCounterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="esGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="esBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </linearGradient>
    <filter id="esShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#05140D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Flooring / Platform Base Shadow -->
  <ellipse cx="32" cy="57" rx="23" ry="4" fill="#000000" opacity="0.18"/>

  <g filter="url(#esShadow)">
    <!-- Elevated Booth Floor Deck -->
    <polygon points="9,55 55,55 51,52 13,52" fill="#334155"/>
    <polygon points="13,52 51,52 48,49 16,49" fill="#475569"/>

    <!-- Booth Architectural Backwall -->
    <path d="M 14 17 L 50 17 L 50 51 L 14 51 Z" fill="url(#esBackwallGrad)" stroke="#475569" stroke-width="0.8"/>
    
    <!-- Video Wall / Graphic Display on Backwall -->
    <rect x="20" y="22" width="24" height="15" rx="1.5" fill="#0A0F1D" stroke="url(#esGoldGrad)" stroke-width="0.8"/>
    <polygon points="28,26 36,29.5 28,33" fill="url(#esGoldGrad)"/>
    <line x1="22" y1="24" x2="42" y2="24" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.8"/>

    <!-- Architectural Overhead Fascia / Curved Canopy Header -->
    <path d="M 10 11 L 54 11 L 51 18 L 13 18 Z" fill="url(#esCanopyGrad)" stroke="#22C55E" stroke-width="0.6"/>
    <!-- Gold Trim on Canopy Header -->
    <polygon points="10,11 54,11 53,13 11,13" fill="url(#esGoldGrad)"/>

    <!-- Spotlights on Canopy Header Beam -->
    <circle cx="20" cy="18" r="1.5" fill="#FEF08A"/>
    <polygon points="20,18 16,28 24,28" fill="url(#esBeamGrad)"/>
    
    <circle cx="44" cy="18" r="1.5" fill="#FEF08A"/>
    <polygon points="44,18 40,28 48,28" fill="url(#esBeamGrad)"/>

    <!-- Left & Right Vertical Architectural Truss Columns -->
    <line x1="12" y1="18" x2="12" y2="52" stroke="url(#esGoldGrad)" stroke-width="2"/>
    <line x1="52" y1="18" x2="52" y2="52" stroke="url(#esGoldGrad)" stroke-width="2"/>

    <!-- Front Curved Reception / Exhibition Display Counter Podium -->
    <path d="M 22 43 C 22 40 42 40 42 43 L 41 53 C 41 53 32 54 23 53 Z" fill="url(#esCounterGrad)" stroke="#CBD5E1" stroke-width="0.8"/>
    <!-- Gold Metallic Inset Band on Counter -->
    <path d="M 22.5 45 C 24 43.5 40 43.5 41.5 45 L 41.5 47 C 40 45.5 24 45.5 22.5 47 Z" fill="url(#esGoldGrad)"/>
    
    <!-- Mini Brochure Holder / Display Item on Counter -->
    <polygon points="26,41 29,39 29,42 26,43" fill="#144D37"/>
    <polygon points="35,40 38,39 38,42 35,43" fill="#D4AF37"/>
  </g>
</svg>
