<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d37"/>
      <stop offset="50%" stop-color="#0f3d2b"/>
      <stop offset="100%" stop-color="#08261a"/>
    </linearGradient>
    <linearGradient id="cgLidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e43"/>
      <stop offset="100%" stop-color="#0d3525"/>
    </linearGradient>
    <linearGradient id="cgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F5D061"/>
    </linearGradient>
    <linearGradient id="cgGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <filter id="cgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#05140d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Glow & Shadow Base -->
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000000" opacity="0.15"/>
  
  <!-- Main Gift Box Body -->
  <g filter="url(#cgShadow)">
    <rect x="13" y="27" width="38" height="27" rx="3" fill="url(#cgBoxGrad)"/>
    <rect x="13" y="27" width="38" height="27" rx="3" fill="none" stroke="#256b4f" stroke-width="0.8"/>
    
    <!-- Vertical Gold Ribbon -->
    <rect x="28" y="27" width="8" height="27" fill="url(#cgGoldGrad)"/>
    <line x1="32" y1="27" x2="32" y2="54" stroke="#FFE9A0" stroke-width="0.6" stroke-opacity="0.8"/>
    
    <!-- Box Lid -->
    <rect x="10" y="20" width="44" height="10" rx="3" fill="url(#cgLidGrad)"/>
    <rect x="10" y="20" width="44" height="10" rx="3" fill="none" stroke="#2a7d5d" stroke-width="0.8"/>
    <rect x="28" y="20" width="8" height="10" fill="url(#cgGoldGrad)"/>
    
    <!-- Gold Bow Left Loop -->
    <path d="M 31 20 C 23 11 14 14 18 20 C 22 23 28 21 31 20 Z" fill="url(#cgGoldGrad)"/>
    <path d="M 29 19 C 23 13 18 15 20 19 C 23 21 27 20 29 19 Z" fill="url(#cgGoldLight)" opacity="0.6"/>
    
    <!-- Gold Bow Right Loop -->
    <path d="M 33 20 C 41 11 50 14 46 20 C 42 23 36 21 33 20 Z" fill="url(#cgGoldGrad)"/>
    <path d="M 35 19 C 41 13 46 15 44 19 C 41 21 37 20 35 19 Z" fill="url(#cgGoldLight)" opacity="0.6"/>
    
    <!-- Bow Center Knot -->
    <circle cx="32" cy="20" r="3.2" fill="url(#cgGoldLight)"/>
    <circle cx="32" cy="20" r="3.2" fill="none" stroke="#9E7310" stroke-width="0.6"/>
    
    <!-- Luxury Hanging Ribbon Tails -->
    <path d="M 30 22 C 28 26 23 30 20 32 C 22 30 26 26 29 23 Z" fill="url(#cgGoldGrad)"/>
    <path d="M 34 22 C 36 26 41 30 44 32 C 42 30 38 26 35 23 Z" fill="url(#cgGoldGrad)"/>
    
    <!-- Little Luxury Sparkle / Gem -->
    <polygon points="46,12 47.5,15 50.5,16.5 47.5,18 46,21 44.5,18 41.5,16.5 44.5,15" fill="#FFE082"/>
    <polygon points="17,14 18,16 20,17 18,18 17,20 16,18 14,17 16,16" fill="#FFE082" opacity="0.8"/>
  </g>
</svg>
