<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="pfRollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="pfSpoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pfMachineBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pfGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <filter id="pfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="32" cy="57" rx="22" ry="3.5" fill="#000000" opacity="0.16"/>

  <g filter="url(#pfShadow)">
    <!-- Wide Format Machine Top Carriage Beam Bar -->
    <rect x="8" y="14" width="48" height="12" rx="3" fill="url(#pfMachineBody)" stroke="#334155" stroke-width="0.8"/>
    <!-- Gold Beam Accent Line -->
    <line x1="11" y1="16.5" x2="53" y2="16.5" stroke="url(#pfGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Moving Heavy Printhead Carriage -->
    <rect x="26" y="18" width="12" height="6.5" rx="1.5" fill="#475569" stroke="#94A3B8" stroke-width="0.6"/>
    <circle cx="32" cy="21.2" r="1.5" fill="#38BDF8"/>

    <!-- Left & Right Machine Vertical Stanchion Legs -->
    <rect x="9" y="26" width="5" height="28" rx="1" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <rect x="50" y="26" width="5" height="28" rx="1" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <!-- Machine Heavy Feet Pads -->
    <rect x="6" y="53" width="11" height="3" rx="1" fill="#0F172A"/>
    <rect x="47" y="53" width="11" height="3" rx="1" fill="#0F172A"/>

    <!-- Precision Dual Chrome Feed Rollers Behind Banner -->
    <rect x="14" y="25" width="36" height="4" rx="2" fill="url(#pfSpoolGrad)"/>

    <!-- Emerging Vibrant High-Resolution Panaflex Banner -->
    <!-- The flexible printed vinyl drape flowing downward -->
    <path d="M 15 28 L 49 28 L 47 48 L 17 48 Z" fill="url(#pfRollGrad)"/>
    
    <!-- Gloss Sheen Overlay on Banner -->
    <path d="M 15 28 L 30 28 L 26 48 L 17 48 Z" fill="#FFFFFF" opacity="0.18"/>
    
    <!-- Printed Artwork Shapes on Banner (Dynamic Corporate Wave & Star) -->
    <path d="M 19 40 C 26 34 36 44 45 37 L 46 41 C 37 47 27 38 18 44 Z" fill="#FFFFFF" opacity="0.65"/>
    <polygon points="32,32 33,34.5 35.5,35 33.5,37 34,39.5 32,38 30,39.5 30.5,37 28.5,35 31,34.5" fill="#FFE082"/>

    <!-- Bottom Weighted Take-Up Tension Steel Spool Roll -->
    <rect x="13" y="47" width="38" height="6" rx="3" fill="url(#pfSpoolGrad)"/>
    <line x1="16" y1="50" x2="48" y2="50" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8"/>
    <circle cx="15" cy="50" r="2" fill="url(#pfGoldGrad)"/>
    <circle cx="49" cy="50" r="2" fill="url(#pfGoldGrad)"/>
  </g>
</svg>
